; Configuration file for application
# Also supports hash-style comments

[server]
host = 127.0.0.1
port = 8080
debug = false
verbose = yes
timeout = none

[database]
driver = "mysql"
host = ${DB_HOST}
name = 'production_db'
port = 3306
enabled = on

[paths]
cache = /var/cache
logs = %APPDATA%/logs

[features]
rate_limit = 1000.5
hex_value = 0xFF00
empty_value =
