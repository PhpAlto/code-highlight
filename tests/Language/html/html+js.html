<!DOCTYPE html>
<html>
<head>
    <script>
        function greet(name) {
            console.log("Hello, " + name);
            return true;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            greet('World');
        });
    </script>
</head>
<body>
    <h1 id="heading">Hello, JavaScript!</h1>
    <button onclick="greet('Button')">Click me</button>
</body>
</html>
