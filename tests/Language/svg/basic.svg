<svg width="400" height="300" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <style>
            .rect-shape {
                fill: #e74c3c;
                stroke: #c0392b;
                stroke-width: 2;
            }
            .text-label {
                font-size: 16px;
                font-weight: bold;
                fill: #fff;
            }
        </style>
    </defs>
    <rect class="rect-shape" x="50" y="50" width="300" height="200" rx="10" />
    <text class="text-label" x="200" y="150" text-anchor="middle">SVG Example</text>
    <circle cx="100" cy="100" r="20" fill="#3498db" />
</svg>
